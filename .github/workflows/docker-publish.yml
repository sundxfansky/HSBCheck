name: Build and publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for HTTP checks
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: hsb-check:smoke
          cache-from: type=gha

      - name: Check container HTTP responses
        shell: bash
        run: |
          set -euo pipefail
          container_id=$(docker run -d -p 127.0.0.1::80 hsb-check:smoke)
          trap 'docker logs "$container_id"; docker rm -f "$container_id"' EXIT
          port=$(docker port "$container_id" 80/tcp | cut -d: -f2)
          base_url="http://127.0.0.1:$port"
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 "$base_url/" -o /dev/null

          # Check the real Vite worker asset, including the MIME type browsers
          # require for module workers and PDF.js's dynamic import fallback.
          worker_file=$(docker exec "$container_id" sh -c 'find /usr/share/nginx/html/assets -name "pdf.worker*.mjs" -print -quit')
          test -n "$worker_file"
          worker_path=${worker_file#/usr/share/nginx/html}
          worker_type=$(curl --fail --silent --show-error -o /dev/null -w '%{content_type}' "$base_url$worker_path")
          test "$worker_type" = application/javascript

          # Missing assets must stay 404s; valid SPA paths still serve HTML.
          test "$(curl --silent -o /dev/null -w '%{http_code}' "$base_url/assets/missing.mjs")" = 404
          test "$(curl --fail --silent -o /dev/null -w '%{content_type}' "$base_url/statement/review")" = text/html

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
